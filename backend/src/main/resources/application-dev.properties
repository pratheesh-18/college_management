# Development Environment Profile Configuration
spring.application.name=edusphere-backend

# Datasource Configuration for Dev Profile (Supports In-Memory H2 fallback when PostgreSQL env vars are unset)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:eduspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configurations
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Application Custom Configurations
app.jwt.secret=9a2f8c4e1b7d5a0f3e6c9b2d8a4f1e7c0b3a6d9e2f5c8b1a4d7e0f3c6b9a2f5e
app.jwt.expiration-ms=86400000
app.upload.dir=./uploads/certificates
